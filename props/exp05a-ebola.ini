# ebola: high infectiousness, low recovery, short duration
# per NetLogo Info tab, ebola has very high transmissibility but kills hosts quickly, so the virus
# tends to burn out rapidly.

[simulation]
number_people = 150
infectiousness = 0.95
chance_recover = 0.10
duration = 3

[constants]
initial_infected = 10
carrying_capacity = 300
lifespan_weeks = 2600
immunity_duration = 52
birth_rate = 0.01

[grid]
width = 35
height = 35

[control]
max_ticks = 5200
random_seed = 42

[extension]
enabled = false
vaccination_rate = 0.0
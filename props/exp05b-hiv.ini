# hiv: very low infectiousness, very low recovery, long duration
# per NetLogo Info tab, hiv spreads slowly but infections last a very long time.

[simulation]
number_people = 150
infectiousness = 0.05
chance_recover = 0.05
duration = 500

[constants]
initial_infected = 10
carrying_capacity = 300
lifespan_weeks = 2600
immunity_duration = 52
birth_rate = 0.01

[grid]
width = 35
height = 35

[control]
max_ticks = 5200
random_seed = 42

[extension]
enabled = false
vaccination_rate = 0.0